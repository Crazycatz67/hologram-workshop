<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hologram Project — Phase 2: Model Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      pointer-events: none;
    }
    #hud > * {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 9px;
      border-radius: 4px;
    }
    #status { color: #7fe3a1; }
    #status.error { color: #ff5c5c; }
    #fps { color: #9db4d0; }

    #hint {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <span id="status">loading…</span>
    <span id="fps">— fps</span>
  </div>
  <div id="hint" hidden>drag to orbit · scroll to zoom · right-drag to pan · R to toggle auto-rotate</div>
  <script type="module">
    import(`./main.js?v=${Date.now()}`);
  </script>
</body>
</html>
