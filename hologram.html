<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hologram Project — Phase 4: Gesture Control</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }

    /* Camera feed sits small in the corner: the hologram is the subject, the feed is
       just enough to see that tracking is working. */
    #feed {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 280px;
      aspect-ratio: 4 / 3;
      border: 1px solid rgba(120, 220, 255, 0.25);
      border-radius: 6px;
      overflow: hidden;
      background: #05080b;
    }
    #cam, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #cam { transform: scaleX(-1); }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      max-width: calc(100% - 24px);
    }
    #hud > * {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 9px;
      border-radius: 4px;
    }
    #status { color: #7fe3a1; }
    #status.error { color: #ff5c5c; }
    #fps { color: #9db4d0; }
    #loaded { color: #6b7d94; }

    #mode { color: #6b7d94; text-transform: uppercase; letter-spacing: 0.08em; }
    #mode.grab { color: #ffd166; border-color: rgba(255, 209, 102, 0.4); }
    #mode.transform { color: #4fd1ff; border-color: rgba(79, 209, 255, 0.4); }

    button {
      font: inherit;
      color: #dff6ff;
      background: rgba(30, 90, 130, 0.75);
      border: 1px solid rgba(120, 220, 255, 0.35);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }

    #readout {
      position: fixed;
      left: 12px;
      bottom: 12px;
      margin: 0;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #9db4d0;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 4px;
      white-space: pre;
      min-height: 1em;
    }

    #hint {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage"></div>

  <div id="feed">
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="hud">
    <button id="start" disabled>start camera</button>
    <button id="reset">reset</button>
    <span id="status">loading model…</span>
    <span id="mode">idle</span>
    <span id="fps">— fps</span>
    <span id="loaded">—</span>
  </div>

  <pre id="readout"></pre>
  <div id="hint">closed fist — move · two-hand pinch — scale &amp; rotate · R — reset · drag — orbit camera</div>

  <script type="module">
    const stamp = Date.now();
    document.getElementById('loaded').textContent = 'loaded ' + new Date().toTimeString().slice(0, 8);
    import(`./hologram.js?v=${stamp}`);
  </script>
</body>
</html>
