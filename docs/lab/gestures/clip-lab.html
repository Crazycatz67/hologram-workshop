<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Clip Lab · gesture clips for the demo hand</title>
  <style>
    html, body { margin: 0; background: #05070a; color: #c9dcec; }
    body { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 4px; color: #4fd1ff; }
    .sub { color: #7f93a6; margin-bottom: 12px; }
    #wrap { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 14px; }
    #clips { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 90px); overflow: auto; }
    #clips li { padding: 6px 8px; border: 1px solid #16222e; border-radius: 6px; margin-bottom: 4px; cursor: pointer; }
    #clips li:hover { border-color: #2a4459; }
    #clips li.active { border-color: #4fd1ff; background: #0b1722; }
    #clips .name { color: #e6f3ff; }
    #clips .saved { float: right; color: #6fdc8c; }
    #clips .ins { color: #7f93a6; margin-top: 2px; }
    #stage { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16 / 9; background: #0a0f15; border-radius: 8px; overflow: hidden; }
    /* Selfie view: the owner sees themselves mirrored; the recorded numbers are NOT mirrored. */
    #video, #live { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    #count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; color: #e6f3ff;
             text-shadow: 0 0 12px #000; pointer-events: none; opacity: 0; transition: opacity 200ms ease; }
    #count.show { opacity: 1; }
    #recDot { position: absolute; top: 10px; left: 10px; color: #ff6b6b; display: none; }
    #recDot.on { display: block; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
    button, select { font: inherit; background: #0f1b26; color: #c9dcec; border: 1px solid #2a4459; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { border-color: #4fd1ff; color: #e6f3ff; }
    #status { color: #4fd1ff; min-height: 1.4em; }
    #previews { display: flex; flex-wrap: wrap; gap: 10px; }
    #previews figure { margin: 0; }
    #previews figcaption { color: #7f93a6; margin-bottom: 4px; }
    canvas.pv { background: #0a0f15; border-radius: 8px; width: 320px; height: 240px; }
    #take { color: #9fb3c6; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Clip Lab</h1>
  <div class="sub">Record each gesture as a clip for the demo hand. Numbers only: landmarks, never camera frames.
    Saves to assets/gesture-clips/ on localhost; elsewhere Keep downloads the file.</div>
  <div id="wrap">
    <ul id="clips"></ul>
    <main>
      <div id="stage">
        <video id="video" playsinline muted></video>
        <canvas id="live"></canvas>
        <div id="count"></div>
        <div id="recDot">● REC</div>
      </div>
      <div class="row">
        <button id="camBtn" class="primary">📷 Camera</button>
        <label>Length <select id="dur"><option>2</option><option>3</option><option selected>4</option><option>5</option></select> s</label>
        <button id="recBtn" disabled>⏺ Record</button>
        <button id="stopBtn" disabled>⏹ Stop</button>
      </div>
      <div class="row">
        <button id="playBtn" disabled>▶ Play take</button>
        <button id="mirrorBtn" disabled>⇋ Mirror</button>
        <button id="keepBtn" disabled class="primary">✓ Keep</button>
        <button id="discardBtn" disabled>✕ Discard</button>
        <button id="savedBtn" disabled>▶ Play saved</button>
      </div>
      <div id="status">Pick a clip, start the camera, then Record.</div>
      <div id="previews">
        <figure><figcaption>Image landmarks (as you see yourself)</figcaption><canvas id="pvImage" class="pv" width="640" height="480"></canvas></figure>
        <figure><figcaption>World landmarks (metres, hand-centred)</figcaption><canvas id="pvWorld" class="pv" width="640" height="480"></canvas></figure>
      </div>
      <div id="take"></div>
    </main>
  </div>
  <script type="module">
    import(`./clip-lab.js?v=${Date.now()}`).catch((err) => {
      document.getElementById('status').textContent = 'clip lab failed to load: ' + err;
      console.error(err);
    });
  </script>
</body>
</html>
