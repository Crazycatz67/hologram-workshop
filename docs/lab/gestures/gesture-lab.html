<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gesture Lab</title>
  <style>
    html, body { margin: 0; background: #05070a; color: #c9dcec; }
    body { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 16px; }
    #status { color: #4fd1ff; margin-bottom: 12px; }
    pre { white-space: pre-wrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">running… (synthetic hands, no camera)</div>
  <pre id="out"></pre>
  <script type="module">
    // Test recorder: saves this run to docs/testing/runs/ on localhost (docs/testing/README.md).
    // If it can't load, the lab runs exactly as before. ?only= runs are a different set of
    // sweeps, so they get their own page id and never compare against the full run.
    const only = new URLSearchParams(location.search).get('only');
    const rec = await import('../../../testrec.js')
      .then((m) => m.startRun({ page: only ? 'gesture-lab-only' : 'gesture-lab', settings: { only } })).catch(() => null);
    import(`./gesture-lab.js?v=${Date.now()}`).then(() => {
      const rep = window.__gestureReport;
      if (rec && rep) {
        for (const [name, g] of Object.entries(rep.gestures ?? {})) {
          rec.result(`${name} fires isolated`, g.isolated?.magnitude ?? null, { pass: !!g.isolated?.fires });
          rec.metric(`bleed.${name}`, g.bleed?.length ?? 0);
        }
        for (const [name, n] of Object.entries(rep.nulls ?? {})) {
          rec.result(`no false fire: ${name}`, n.unexpected ?? [], { pass: !(n.unexpected ?? []).length });
        }
        rec.attach('report', rep);
      }
      rec?.end();
    }).catch((err) => {
      document.getElementById('status').textContent = 'lab crashed: ' + err;
      console.error(err);
      rec?.end('crashed');
    });
  </script>
</body>
</html>
