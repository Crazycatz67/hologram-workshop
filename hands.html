<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hologram Project — Phase 1: Hand Tracking</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
    body { display: grid; place-items: center; }

    #stage { position: relative; width: 100%; height: 100%; }
    #cam, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Mirrored so it reads like a mirror. The overlay canvas is deliberately not
       mirrored here — it flips landmark x itself, which keeps its text readable. */
    #cam { transform: scaleX(-1); }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #hud > * {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 9px;
      border-radius: 4px;
    }
    #status { color: #7fe3a1; }
    #status.error { color: #ff5c5c; }
    #fps { color: #9db4d0; }
    #build { color: #6b7d94; }

    #start {
      font: inherit;
      color: #dff6ff;
      background: rgba(30, 90, 130, 0.75);
      border: 1px solid rgba(120, 220, 255, 0.35);
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    #start:disabled { opacity: 0.5; cursor: default; }

    #readout {
      position: fixed;
      bottom: 12px;
      left: 12px;
      margin: 0;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #9db4d0;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 4px;
      white-space: pre;
      min-height: 1em;
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="hud">
    <button id="start">start camera</button>
    <span id="status">idle</span>
    <span id="fps">— fps</span>
    <span id="build">—</span>
  </div>
  <pre id="readout"></pre>

  <script type="module">
    // Cache-bust every module on load. This page may itself be served from cache, but the
    // stamp is computed at runtime, so the code it pulls in is always current — which is
    // what matters when the machine that tests this is not the machine that edits it.
    // Stamped when this page loads, not a running clock: if it does not change after a
    // refresh, the page came from cache and any new code has not arrived.
    const stamp = Date.now();
    document.getElementById('build').textContent = 'loaded ' + new Date().toTimeString().slice(0, 8);
    import(`./hands.js?v=${stamp}`);
  </script>
</body>
</html>
