<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hologram Photosafety Test</title>
  <style>
    body { background: #0b0f14; color: #cfe7f5; font: 14px ui-monospace, Menlo, monospace; margin: 16px; }
    #view canvas { border: 1px solid #234; max-width: 100%; }
    pre { white-space: pre-wrap; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <h1>Photosafety test</h1>
  <p>Renders the chair hologram at a fixed 60 fps and counts flashes per WCAG 2.3.1 (limit: 3 per second).
    Content warning: the "v1" run reproduces the old look, which flickers. The canvas below shows each frame as it renders.</p>
  <div id="view"></div>
  <pre id="out">running…
</pre>
  <script type="module">
    // Test recorder: saves this run to docs/testing/runs/ on localhost (docs/testing/README.md).
    // If it can't load, the test runs exactly as before.
    const rec = await import('./testrec.js').then((m) => m.startRun({ page: 'safety-test' })).catch(() => null);
    import('./safety-test.js?v=' + Date.now()).then(() => {
      for (const r of window.safetyResults ?? []) rec?.result(r.label, r.flashesPerSecond, { pass: r.verdict === 'PASS' });
      rec?.attach('results', window.safetyResults ?? []);
      rec?.end();
    }).catch((e) => {
      document.getElementById('out').textContent += 'ERROR ' + e.message + '\n';
      rec?.end('crashed');
    });
  </script>
</body>
</html>
