<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>P5 inferred test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;background:#0b0f14;color:#cfe;font:12px ui-monospace,monospace}
  #wrap{padding:10px}
  pre{white-space:pre-wrap;margin:8px 0}
  canvas{display:block;margin-top:8px;border:1px solid #234}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/" } }
</script></head>
<body><div id="wrap">
<b>P5 "Show what was filled in": contract + photosafety checks</b> (Track B completion output in the Platform).
The canvas shows each frame as it renders; the look is static-hatched and dim, nothing here flickers.
<pre id="out">running…</pre>
<div id="view"></div>
</div>
<script type="module">
  // Test recorder: saves this run to docs/testing/runs/ on localhost (docs/testing/README.md).
  // If it can't load, the test runs exactly as before.
  const rec = await import('../testrec.js').then((m) => m.startRun({ page: 'p5-test' })).catch(() => null);
  import('./p5-test.js?v=' + Date.now()).then(() => {
    for (const r of window.p5Results?.results ?? []) rec?.result(r.name, r.detail ?? '', { pass: !!r.ok });
    rec?.end();
  }).catch((e) => {
    document.getElementById('out').textContent += '\nERROR ' + (e.stack || e);
    console.error(e);
    rec?.end('crashed');
  });
</script>
</body></html>
