<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model viewer · Hologram Workshop</title>
  <meta name="description" content="The scanned chair as a hologram: drag to orbit, measure it, no camera needed." />
  <link rel="icon" href="assets/site/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a0d11" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Same shell as hologram.html / platform (theme.css): measurements beside the view,
       never over it. M collapses the column. */
    #app {
      height: 100%; display: grid;
      grid-template-rows: var(--bar-h) 1fr var(--status-h);
      grid-template-columns: var(--left-w, 290px) 1fr;
      grid-template-areas: "top top" "left stage" "status status";
    }
    #app:has(#measure.hidden) { --left-w: 0px; }
    #topbar { grid-area: top; }
    #measure { grid-area: left; border-right: 1px solid var(--line); padding: 12px 12px 14px; font-size: 12px; }
    #measure.hidden { display: none; }
    #stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #statusbar { grid-area: status; }
    #status { color: var(--ok); }
    #status.error { color: var(--err); }
    #fps { margin-left: auto; color: var(--faint); }
    a.btn { display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--line-2); color: var(--text); text-decoration: none; white-space: nowrap; }
    a.btn.ghost { border-color: transparent; color: var(--muted); }
    a.btn.ghost:hover { color: var(--text); }
    a.btn.primary { color: #06131a; background: var(--accent); border-color: var(--accent); font-weight: 600; }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    @media (max-width: 560px) { a.btn.ghost, #topbar > .note { display: none; } }
    @media (max-width: 760px) {
      #app { grid-template-columns: 0 1fr; }
      #measure:not(.hidden) { position: fixed; top: var(--bar-h); bottom: var(--status-h); left: 0; width: min(300px, 86vw); z-index: 25; box-shadow: 0 0 40px rgba(0,0,0,.55); }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar">
      <div class="brand"><a href="index.html" title="Home">Hologram <span>Workshop</span></a></div>
      <span id="site-nav"></span>
      <div class="sep"></div>
      <span class="note">Model viewer</span>
      <div class="spacer"></div>
      <!-- Links styled as buttons (an <a> wrapping a <button> is invalid and needs two Tab stops). -->
      <a class="btn ghost" href="hologram.html">Gesture demo →</a>
      <a class="btn primary" href="platform/index.html">Open the workshop →</a>
    </header>
    <aside id="measure" class="side" aria-label="Measurements"></aside>
    <main id="stage" aria-label="Model"></main>
    <footer id="statusbar" class="statusbar">
      <span id="status">loading…</span>
      <span id="hint" hidden>drag to orbit · scroll to zoom · right-drag to pan · R auto-rotate · M measurements</span>
      <span id="fps">— fps</span>
    </footer>
  </div>

  <script type="module" src="site-nav.js"></script>
  <script type="module">
    import(`./main.js?v=${Date.now()}`);
  </script>
</body>
</html>
